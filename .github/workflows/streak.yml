name: Generate Streak Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Streak Stats
        run: |
          curl -fL --retry 3 --retry-delay 5 \
            "https://streak-stats.demolab.com?user=${{ github.repository_owner }}&theme=dark&hide_border=true&date_format=j%20M%5B%20Y%5D&background=0d0000&ring=ffd700&fire=8b0000&currStreakLabel=ffd700&sideLabels=ffd700" \
            -o github-streak-stats.svg

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add github-streak-stats.svg

          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update Streak Stats [skip ci]"
            git push
          fi
